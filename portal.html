<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>History Assignment Portal</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: #f3f4f6; color: #1f2937; padding: 2rem 1rem; }
        .container { max-width: 1000px; margin: 0 auto; }
        header { margin-bottom: 2rem; border-bottom: 2px solid #e5e7eb; padding-bottom: 1rem; }
        h1 { color: #111827; font-size: 2rem; }
        .course-tabs { display: flex; gap: 0.75rem; margin-bottom: 1.5rem; }
        .course-btn { flex: 1; background: #374151; border: none; padding: 14px; font-weight: 700; border-radius: 8px; cursor: pointer; color: white; font-size: 1.1rem; transition: all 0.2s; text-align: center; }
        .course-btn.active { background: #4f46e5; }
        .unit-tabs { display: flex; flex-wrap: wrap; gap: 0.35rem; margin-bottom: 1.5rem; border-bottom: 2px solid #e5e7eb; padding-bottom: 4px; }
        .unit-btn { background: #e5e7eb; border: none; padding: 8px 14px; font-weight: 600; border-radius: 6px 6px 0 0; cursor: pointer; color: #4b5563; }
        .unit-btn.active { background: #fff; color: #4f46e5; border: 2px solid #e5e7eb; border-bottom-color: #fff; font-weight: 700; margin-bottom: -2px; }
        .panel-content { background: white; padding: 2.5rem; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        .prompt-box { background: #fef3c7; border-left: 4px solid #d97706; padding: 1.25rem; margin-bottom: 1.5rem; border-radius: 0 4px 4px 0; font-style: italic; }
        label { display: block; font-weight: 600; margin-bottom: 0.5rem; color: #374151; }
        input[type="text"] { width: 100%; padding: 12px; margin-bottom: 1.5rem; border: 2px solid #d1d5db; border-radius: 6px; font-size: 1rem; }
        textarea { width: 100%; height: 320px; padding: 1.25rem; border: 2px solid #d1d5db; border-radius: 6px; font-size: 1.05rem; resize: vertical; }
        .warning-msg { color: #b91c1c; font-weight: 600; font-size: 0.9rem; margin-top: 0.5rem; display: none; }
        .submit-btn { background: #10b981; color: white; border: none; padding: 14px 28px; border-radius: 6px; font-size: 1.05rem; font-weight: 600; cursor: pointer; margin-top: 1rem; float: right; }
        .submit-btn:disabled { background: #a7f3d0; cursor: not-allowed; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>📜 History Assignment Portal</h1>
            <p>Select your course and unit below. Type your response directly into the box. Copy/Paste is disabled.</p>
        </header>
        <div class="course-tabs">
            <button class="course-btn active" onclick="selectCourse('APUSH')">APUSH</button>
            <button class="course-btn" onclick="selectCourse('APHUG')">APHUG</button>
            <button class="course-btn" onclick="selectCourse('USR')">USR</button>
        </div>
        <div class="panel-content">
            <div id="unitTabsContainer" class="unit-tabs"></div>
            <div id="promptDisplayContainer">
                <h3 id="assignmentTitle">Loading Assignment...</h3>
                <div id="assignmentPrompt" class="prompt-box">Please wait...</div>
            </div>
            <hr style="margin: 2.5rem 0; border: 0; border-top: 2px solid #e5e7eb;">
            <label for="studentName">Student Name:</label>
            <input type="text" id="studentName" placeholder="First and Last Name" autocomplete="off" onpaste="return false;" ondrop="return false;">
            <label for="essayResponse">Your Essay Response:</label>
            <textarea id="essayResponse" placeholder="Start typing your essay response here..." onpaste="return false;" ondrop="return false;" autocomplete="off"></textarea>
            <div id="pasteWarning" class="warning-msg">⚠️ Copying and pasting is disabled. Please type manually.</div>
            <button class="submit-btn" id="submitBtn" onclick="submitWork()">Submit Assignment</button>
            <div style="clear: both;"></div>
        </div>
    </div>
    <script>
        const courseData = {
            APUSH: { totalUnits: 9, prompts: { 1: "Analyze the social and economic impacts of the Stamp Act of 1765 on the American colonists.", 2: "[APUSH Unit 2] Enter prompt here.", 3: "[APUSH Unit 3] Enter prompt here.", 4: "[APUSH Unit 4] Enter prompt here.", 5: "[APUSH Unit 5] Enter prompt here.", 6: "[APUSH Unit 6] Enter prompt here.", 7: "[APUSH Unit 7] Enter prompt here.", 8: "[APUSH Unit 8] Enter prompt here.", 9: "[APUSH Unit 9] Enter prompt here." } },
            APHUG: { totalUnits: 7, prompts: { 1: "[APHUG Unit 1] Enter prompt here.", 2: "[APHUG Unit 2] Enter prompt here.", 3: "[APHUG Unit 3] Enter prompt here.", 4: "[APHUG Unit 4] Enter prompt here.", 5: "[APHUG Unit 5] Enter prompt here.", 6: "[APHUG Unit 6] Enter prompt here.", 7: "[APHUG Unit 7] Enter prompt here." } },
            USR: { totalUnits: 12, prompts: { 1: "[USR Unit 1] Enter prompt here.", 2: "[USR Unit 2] Enter prompt here.", 3: "[USR Unit 3] Enter prompt here.", 4: "[USR Unit 4] Enter prompt here.", 5: "[USR Unit 5] Enter prompt here.", 6: "[USR Unit 6] Enter prompt here.", 7: "[USR Unit 7] Enter prompt here.", 8: "[USR Unit 8] Enter prompt here.", 9: "[USR Unit 9] Enter prompt here.", 10: "[USR Unit 10] Enter prompt here.", 11: "[USR Unit 11] Enter prompt here.", 12: "[USR Unit 12] Enter prompt here." } }
        };
        const SUPABASE_URL = "https://ucxwiywoxpeqapgwhsmi.supabase.co";
        const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVjeHdpeXdveHBlcWFwZ3doc21pIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAzMzE0NzMsImV4cCI6MjA5NTkwNzQ3M30.VToVqabwqL7d1CpBkxztJt4hCQL-koX4Eq7rd7lx9Sg";
        let selectedCourse = "APUSH";
        let activeUnits = { APUSH: 1, APHUG: 1, USR: 1 };
        function renderPortal() {
            const tabsContainer = document.getElementById('unitTabsContainer');
            tabsContainer.innerHTML = ''; 
            const currentCourseConfig = courseData[selectedCourse];
            const activeUnitForCourse = activeUnits[selectedCourse];
            for (let i = 1; i <= currentCourseConfig.totalUnits; i++) {
                const btn = document.createElement('button');
                btn.className = `unit-btn ${i === activeUnitForCourse ? 'active' : ''}`;
                btn.innerText = `Unit ${i}`;
                btn.onclick = () => selectUnit(i);
                tabsContainer.appendChild(btn);
            }
            document.getElementById('assignmentTitle').innerText = `${selectedCourse} - Unit ${activeUnitForCourse}`;
            document.getElementById('assignmentPrompt').innerText = currentCourseConfig.prompts[activeUnitForCourse] || "No custom prompt entered yet.";
        }
        function selectCourse(courseCode) {
            selectedCourse = courseCode;
            document.querySelectorAll('.course-btn').forEach(btn => {
                btn.classList.toggle('active', btn.innerText === courseCode);
            });
            document.getElementById('essayResponse').value = '';
            document.getElementById('studentName').value = '';
            renderPortal();
        }
        function selectUnit(unitNumber) {
            activeUnits[selectedCourse] = unitNumber;
            document.getElementById('essayResponse').value = '';
            renderPortal();
        }
        const essayArea = document.getElementById('essayResponse');
        const nameField = document.getElementById('studentName');
        const warning = document.getElementById('pasteWarning');
        [essayArea, nameField].forEach(element => {
            element.addEventListener('paste', e => { e.preventDefault(); showWarning(); });
            element.addEventListener('drop', e => { e.preventDefault(); showWarning(); });
        });
        function showWarning() { warning.style.display = 'block'; setTimeout(() => { warning.style.display = 'none'; }, 4000); }
        async function submitWork() {
            const name = nameField.value.trim();
            const text = essayArea.value.trim();
            const currentUnit = activeUnits[selectedCourse];
            const submitBtn = document.getElementById('submitBtn');
            if(!name || !text) { alert("Please provide your name and write an essay response."); return; }
            submitBtn.disabled = true;
            try {
                const response = await fetch(`${SUPABASE_URL}/rest/v1/submissions`, {
                    method: 'POST',
                    headers: { 'apikey': SUPABASE_ANON_KEY, 'Authorization': `Bearer ${SUPABASE_ANON_KEY}`, 'Content-Type': 'application/json' },
                    body: JSON.stringify({ student_name: name, course: selectedCourse, unit: parseInt(currentUnit), essay_text: text })
                });
                if (response.ok) { alert("✅ Success! Your essay has been securely submitted."); essayArea.value = ''; nameField.value = ''; }
                else { throw new Error(); }
            } catch (error) { alert("❌ Submission failed."); }
            finally { submitBtn.disabled = false; }
        }
        renderPortal();
    </script>
</body>
</html>
