<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>History Assignment Portal</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: #f3f4f6; color: #1f2937; padding: 2rem 1rem; }
        .container { max-width: 1000px; margin: 0 auto; }
        header { margin-bottom: 2rem; border-bottom: 2px solid #e5e7eb; padding-bottom: 1rem; }
        h1 { color: #111827; font-size: 2rem; }
        
        .course-tabs { display: flex; gap: 0.75rem; margin-bottom: 1.5rem; }
        .course-btn { flex: 1; background: #374151; border: none; padding: 14px; font-weight: 700; border-radius: 8px; cursor: pointer; color: white; font-size: 1.1rem; transition: all 0.2s; text-align: center; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        .course-btn.active { background: #4f46e5; transform: translateY(-2px); box-shadow: 0 6px 12px rgba(79, 70, 229, 0.3); }
        
        .unit-tabs { display: flex; flex-wrap: wrap; gap: 0.35rem; margin-bottom: 1.5rem; border-bottom: 2px solid #e5e7eb; padding-bottom: 4px; }
        .unit-btn { background: #e5e7eb; border: none; padding: 8px 14px; font-weight: 600; border-radius: 6px 6px 0 0; cursor: pointer; color: #4b5563; transition: all 0.2s; font-size: 0.9rem; }
        .unit-btn.active { background: #fff; color: #4f46e5; border: 2px solid #e5e7eb; border-bottom-color: #fff; font-weight: 700; margin-bottom: -2px; }
        
        .panel-content { background: white; padding: 2.5rem; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        .prompt-box { background: #fef3c7; border-left: 4px solid #d97706; padding: 1.25rem; margin-bottom: 1.5rem; border-radius: 0 4px 4px 0; font-style: italic; line-height: 1.5; }
        
        label { display: block; font-weight: 600; margin-bottom: 0.5rem; color: #374151; font-size: 0.95rem; }
        input[type="text"] { width: 100%; padding: 12px; margin-bottom: 1.5rem; border: 2px solid #d1d5db; border-radius: 6px; font-size: 1rem; outline: none; -webkit-user-select: text; user-select: text; }
        input[type="text"]:focus { border-color: #4f46e5; }
        
        textarea { width: 100%; height: 320px; padding: 1.25rem; border: 2px solid #d1d5db; border-radius: 6px; font-size: 1.05rem; line-height: 1.6; resize: vertical; outline: none; transition: border 0.2s; -webkit-user-select: text; user-select: text; }
        textarea:focus { border-color: #4f46e5; }
        
        .warning-msg { color: #b91c1c; font-weight: 600; font-size: 0.9rem; margin-top: 0.5rem; display: none; }
        .submit-btn { background: #10b981; color: white; border: none; padding: 14px 28px; border-radius: 6px; font-size: 1.05rem; font-weight: 600; cursor: pointer; margin-top: 1rem; float: right; transition: background 0.2s; }
        .submit-btn:hover { background: #059669; }
        .submit-btn:disabled { background: #a7f3d0; cursor: not-allowed; }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>📜 History Assignment Portal</h1>
            <p>Select your course and unit below. Type your response directly into the box. Copy/Paste is disabled.</p>
        </header>

        <div class="course-tabs">
            <button class="course-btn active" onclick="selectCourse('APUSH
